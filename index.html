<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Gestión de Usuarios</title>

  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <header class="encabezado">
    <div class="encabezado-interno">
      <h1>Panel de usuarios</h1>
      <p class="subtitulo">Consulta, registra, edita y elimina usuarios sin recargar la página.</p>
    </div>
  </header>

  <main class="contenedor">

    
    <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>

    <div class="paneles">

      
      <section class="tarjeta" aria-labelledby="titulo-form">
        <h2 id="titulo-form">Registrar usuario</h2>

        <form id="formulario" novalidate>
          <div class="campo">
            <label for="id">Id</label>
            <input type="text" id="id" name="id" inputmode="numeric" placeholder="Ej: 11" autocomplete="off">
          </div>

          <div class="campo">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" autocomplete="off">
          </div>

          <div class="campo">
            <label for="correo">Correo</label>
            <input type="text" id="correo" name="correo" placeholder="nombre@correo.com" autocomplete="off">
          </div>

          <div class="campo">
            <label for="ciudad">Ciudad</label>
            <input type="text" id="ciudad" name="ciudad" placeholder="Ciudad" autocomplete="off">
          </div>

          <div class="acciones-form">
            
            <button type="submit" id="btn-enviar" class="btn btn-principal">Agregar</button>
            <button type="button" id="btn-cancelar" class="btn btn-secundario" hidden>Cancelar</button>
          </div>
        </form>
      </section>

      
      <section class="tarjeta" aria-labelledby="titulo-lista">
        <h2 id="titulo-lista">Usuarios</h2>

        <div class="campo campo-buscar">
          <label for="buscador" class="solo-lectores">Buscar por nombre</label>
          <div class="buscador">
            
            <svg class="icono-lupa" viewBox="0 0 24 24" width="18" height="18" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="search" id="buscador" placeholder="Buscar por nombre" autocomplete="off">
          </div>
        </div>

        
        <p id="resumen" class="resumen"></p>

        <div class="tabla-contenedor">
          <table>
            <thead>
              <tr>
                <th>Id</th>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Ciudad</th>
                <th>Acciones</th>
              </tr>
            </thead>
            
            <tbody id="cuerpo-tabla"></tbody>
          </table>
        </div>
      </section>

    </div>
  </main>


  <script src="script.js"></script>
</body>
</html>
